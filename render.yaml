services:
  - type: web
    name: rag-colosseum
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python prefetch.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
